services:
  portfolio:
    image: 'nginx:alpine'
    container_name: mon-portfolio
    restart: unless-stopped
    ports:
      - '3001:80'
    volumes:
      - .:/usr/share/nginx/html

  portfolio-backend:
    build: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - '3002:3001'
    environment:
      - PORT=${PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - RECEIVER_EMAIL=${RECEIVER_EMAIL}
